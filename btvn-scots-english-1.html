<script>
const {useState,useEffect,useRef}=React,h=React.createElement;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ST=[
{k:'done',t:'Hoàn thành',c:'sd',x:['C6EFCE','006100']},
{k:'part',t:'Chưa hoàn thành',c:'sp',x:['FFF2CC','9C5700']},
{k:'miss',t:'Thiếu',c:'sm',x:['F8CBAD','843C0C']},
{k:'none',t:'Không làm',c:'sn',x:['FF0000','FFFFFF']},

const KEY='btvn-star-v1',NOW=new Date(),uid=()=>Math.random().toString(36).slice(2,9);

const days=c=>{const wd=c.pair==='36'?[2,5]:[4,0],n=new Date(c.year,c.month,0).getDate(),r=[];for(let d=1;d<=n;d++)if(wd.includes(new Date(c.year,c.month-1,d).getDay()))r.push(d);return r};

async function exportX(c,rows,tp,rw){
 const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet(('T'+c.month+'-'+(c.code||c.name)).replace(/[\\\/*?:\[\]]/g,'').slice(0,31)||'Lop');
 const ds=days(c),ln={style:'thin',color:{argb:'FF8C8C8C'}},bd={top:ln,left:ln,bottom:ln,right:ln},ct={horizontal:'center',vertical:'middle',wrapText:true};

 const box=(r1,c1,r2,c2,v,o)=>{for(let r=r1;r<=r2;r++)for(let q=c1;q<=c2;q++)put(r,q,r===r1&&q===c1?v:'',o);if(r1!==r2||c1!==c2)ws.mergeCells(r1,c1,r2,c2)};
 const H={bg:'134C81',fg:'FFFFFF',b:1};
 let tc=3;ds.forEach(d=>tc+=cols(c,d).length);
 ws.getCell(1,1).value='BẢNG THEO DÕI BÀI TẬP VỀ NHÀ - '+c.name+(c.code?' ('+c.code+')':'')+' - Tháng '+c.month+'/'+c.year;
 ws.getCell(1,1).font={bold:true,size:14};ws.mergeCells(1,1,1,tc+1);
 box(2,1,3,1,'STT',H);box(2,2,3,2,'Họ tên học sinh',H);
 let q=3;
 ds.forEach(d=>{const cs=cols(c,d);box(2,q,2,q+cs.length-1,lab(c,d),H);cs.forEach(([k,l],j)=>put(3,q+j,l,H));q+=cs.length});
 box(2,tc,3,tc,'Tổng bài Hoàn thành',H);box(2,tc+1,3,tc+1,'Tổng Star',H);
 rows.forEach((r,i)=>{const y=4+i;put(y,1,i+1);put(y,2,r.s.name);ws.getCell(y,2).alignment={vertical:'middle'};let p=3;
  ds.forEach(d=>cols(c,d).forEach(([k])=>{const v=c.v[dk(c,d)+'|'+r.s.id+'|'+k];v?put(y,p,SM[v].t,{bg:SM[v].x[0],fg:SM[v].x[1]}):put(y,p,'');p++}));
  put(y,tc,r.d,{b:1});put(y,tc+1,r.t,{b:1,bg:'FFF2CC'})});
 let y=4+rows.length+1;ws.getCell(y,1).value='TOP 3 VINH DANH CUỐI THÁNG';ws.getCell(y,1).font={bold:true,size:12};y++;
 ['Hạng','Họ tên','Star','Hoàn thành','Không làm','Thưởng ($)'].forEach((t,i)=>put(y,1+i,t,H));
 tp.forEach((r,i)=>{y++;[i+1,r.s.name,r.t,r.d,r.n,rw[i]||''].forEach((t,j)=>put(y,1+j,t,{b:j===1}))});
 ws.getColumn(1).width=6;ws.getColumn(2).width=28;for(let i=3;i<=tc+1;i++)ws.getColumn(i).width=15;
 ws.getRow(3).height=32;ws.views=[{state:'frozen',xSplit:2,ySplit:3}];
 ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0};
 const buf=await wb.xlsx.writeBuffer(),a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
 a.download=('BTVN_'+(c.code||c.name)+'_T'+c.month+'-'+c.year+'.xlsx').replace(/[^\w.\-]+/g,'_');
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function App(){
 const [S,setS]=useState(()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.cls&&j.cls.length)return j}catch(e){}const n=newCls();return{cls:[n],act:n.id,star:{done:2,part:1,miss:1,none:0,nohw:0},rw:['','','']}});
 const [imp,setImp]=useState(''),[cf,setCf]=useState(false),[msg,setMsg]=useState(''),[sync,setSync]=useState('load'),[ready,setReady]=useState(false),[mod,setMod]=useState(null);
 const R=useRef({last:'',busy:false,tm:0,S:null,lf:0,fail:0,again:0}).current;
 const payload=s=>JSON.stringify({cls:s.cls,star:s.star,rw:s.rw});
 const dirty=()=>payload(R.S)!==R.last;
 const tmo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Error('hết thời gian chờ')),ms))]);
 const norm=j=>{if(typeof j==='string')j=j.trim()?JSON.parse(j):null;if(!j||(Array.isArray(j)&&!j.length))return null;if(j.cls===undefined&&j.data!==undefined)return norm(j.data);if(Array.isArray(j.cls))return j.cls.length?j:null;if(!Object.keys(j).filter(k=>k!=='ok'&&k!=='status').length)return null;throw Error('định dạng dữ liệu Apps Script trả về không khớp (cần {cls,star,rw})')};
 const call=async(opt,url)=>{const r=await tmo(fetch(url||GAS,opt),30000),t=await r.text();if(!r.ok)throw Error('HTTP '+r.status);if(/^\s*</.test(t))throw Error('Apps Script trả về trang HTML - kiểm tra Deploy: mục Who has access phải là Anyone');return t};
 const why=e=>{const m=(e&&(e.message||e.code))||'lỗi không rõ';return /Failed to fetch|NetworkError|Load failed/i.test(m)?m+' (kiểm tra mạng và quyền Anyone của Apps Script)':m};
 const flush=async()=>{clearTimeout(R.tm);if(R.busy){R.again=1;return}if(R.lf)return;R.busy=true;R.fail=0;setSync('saving');
  try{do{R.again=0;const b=payload(R.S),t=await call({method:'POST',body:b});let j;try{j=JSON.parse(t)}catch(e){}if(j&&(j.ok===false||j.error))throw Error(j.error||'Apps Script báo lỗi');R.last=b}while(R.again||dirty());setSync('saved')}

  R.busy=false};
 const load=async()=>{setSync('load');R.lf=0;
  try{const d=norm(await call({cache:'no-store'},GAS+'?t='+Date.now()));
   if(d){const s=R.S,n={...s,cls:d.cls,star:d.star||s.star,rw:d.rw||s.rw,act:d.cls.some(x=>x.id===s.act)?s.act:d.cls[0].id};R.S=n;R.last=payload(n);setS(n)}else R.last='';
   setReady(true);if(dirty())flush();else setSync('saved')}
  catch(e){R.lf=1;setSync('err');setReady(true);setMsg('⚠️ Không tải được dữ liệu Cloud: '+why(e)+'. Tạm thời chưa lưu lên Cloud để tránh ghi đè dữ liệu cũ.')}};

 const c=S.cls.find(x=>x.id===S.act)||S.cls[0];
 const set=p=>setS(s=>({...s,cls:s.cls.map(x=>x.id===c.id?{...x,...p}:x)}));
 const ds=days(c),rows=c.students.map(s=>({s,...stats(c,s,S.star)}));
 const tp=[...rows].sort((a,b)=>b.t-a.t||b.d-a.d||a.n-b.n).slice(0,3).filter(r=>r.t>0);
 const cyc=key=>{const o=['',...ST.map(s=>s.k)],nx=o[(o.indexOf(c.v[key]||'')+1)%o.length],v={...c.v};nx?v[key]=nx:delete v[key];set({v})};
 const fill=(d,k,val)=>{const v={...c.v};c.students.forEach(s=>{const key=dk(c,d)+'|'+s.id+'|'+k;val?v[key]=val:delete v[key]});set({v})};
 const tog=(d,k)=>{const o=c.x[dk(c,d)]||{};set({x:{...c.x,[dk(c,d)]:{...o,[k]:!o[k]}}})};
 const addCls=()=>{const n=newCls();setCf(false);setS(s=>({...s,cls:[...s.cls,n],act:n.id}))};
 const delCls=()=>{if(!cf){setCf(true);return}setCf(false);setS(s=>{let l=s.cls.filter(x=>x.id!==c.id);if(!l.length)l=[newCls()];return{...s,cls:l,act:l[0].id}})};
 const addImp=()=>{const ns=imp.split(/\r?\n/).map(l=>(l.split('\t').map(s=>s.trim()).filter(s=>s&&!/^\d+$/.test(s)).pop()||'').replace(/^\d+[.)\-\s]+/,'')).filter(Boolean);if(ns.length)set({students:[...c.students,...ns.map(n=>({id:uid(),name:n}))]});setImp('');setMod(null)};
 const doExport=async()=>{setMsg('');try{await exportX(c,rows,tp,S.rw);setMsg('✅ Đã gửi file Excel.')}catch(e){if(e&&e.code==='declined')return;setMsg('⚠️ Không tải được file: '+((e&&(e.message||e.code))||'lỗi không rõ'))}};
 const CH=({load:['⏳ Đang tải dữ liệu...','k0'],saving:['⏳ Đang lưu...','k1'],saved:['Đã lưu lên Cloud ✓','k2'],err:[R.lf?'Lỗi tải - Bấm thử lại':'Lỗi lưu - Bấm thử lại','k3']})[sync];
 if(!ready)return h('div',{style:{padding:40,textAlign:'center',fontFamily:'Baloo 2',fontSize:20,color:'#134C81'}},'⏳ Đang tải dữ liệu...');
 const F=(l,el)=>h('label',{className:'fl'},l,el);
 const YS=[...new Set([NOW.getFullYear()-1,NOW.getFullYear(),NOW.getFullYear()+1,NOW.getFullYear()+2,c.year])].sort();
 const s1={position:'sticky',left:0,zIndex:2,minWidth:44,width:44,background:'inherit'},s2={...s1,left:44,minWidth:170,textAlign:'left'};
 const TC=['#49A31F','#FA832E','#3AA7C4','#6B3FA0'],colName=k=>COLS.find(x=>x[0]===k)[1];
 const Logo=h('svg',{width:40,height:40,viewBox:'0 0 40 40',fill:'#58B99F'},[[0,0,40,11],[0,0,12,24],[0,14,40,11],[28,14,12,26],[0,29,40,11]].map((r,i)=>h('rect',{key:i,x:r[0],y:r[1],width:r[2],height:r[3],rx:4})));
 const Modal=(t,body)=>h('div',{className:'ov',onClick:e=>{if(e.target===e.currentTarget)setMod(null)}},h('div',{className:'mo'},h('div',{className:'flex items-center justify-between mb-3'},h('h3',{className:'hd2'},t),h('button',{className:'x',onClick:()=>setMod(null)},'✕')),body));
 const modal=!mod?null:Modal(
  mod.t==='imp'?'+ Thêm học sinh (nhập nhanh)':mod.t==='star'?'⚙️ Cấu hình Star':'⚡ Điền nhanh · '+colName(mod.k)+' · '+lab(c,mod.d),
  mod.t==='imp'?h('div',{className:'flex flex-col gap-3'},h('textarea',{className:'i',rows:8,value:imp,placeholder:'Dán danh sách tên từ Excel/Word, mỗi dòng một học sinh',onChange:e=>setImp(e.target.value)}),h('div',{className:'text-xs'},'Hiện có '+c.students.length+' học sinh trong lớp.'),h('button',{className:'bt',onClick:addImp},'Thêm vào danh sách')):
  mod.t==='star'?h('div',{className:'flex flex-col gap-2'},ST.map(s=>h('label',{key:s.k,className:'flex items-center justify-between gap-3'},h('span',{className:'pill '+s.c},s.t),h('span',{className:'flex items-center gap-1'},'+',h('input',{type:'number',step:'0.5',className:'i w-20',value:S.star[s.k],onChange:e=>setS(x=>({...x,star:{...x.star,[s.k]:e.target.value}}))})))),h('div',{className:'text-xs'},'Số Star cộng cho mỗi ô bài tập theo trạng thái.')):
  h('div',{className:'flex flex-col gap-2'},h('div',{className:'text-xs'},'Áp dụng cho cả lớp ('+c.students.length+' học sinh). Sau đó chỉ cần sửa lại vài bạn.'),ST.map(s=>h('button',{key:s.k,className:'fillb',onClick:()=>{fill(mod.d,mod.k,s.k);setMod(null)}},h('span',{className:'pill '+s.c},s.t))),h('button',{className:'bt g',onClick:()=>{fill(mod.d,mod.k,'');setMod(null)}},'⌫ Xóa trạng thái cả cột')));
