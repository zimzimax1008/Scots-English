<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{
  --navy:#134C81;--navy-d:#0E3A63;--teal:#4FB398;--teal-d:#38967D;
  --sky:#DFF1F6;--sky-2:#EDF6FA;--red:#EF4D31;--amber:#B45309;
  --bg:#F2F5FA;--surface:#FFFFFF;--ink:#102A43;--muted:#5B748E;--line:#DCE5F0;
  box-sizing:border-box;color-scheme:light
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background-color:var(--bg);background-image:radial-gradient(circle at 6% 8%,rgba(79,179,152,.095) 0%,transparent 34%),radial-gradient(circle at 94% 88%,rgba(19,76,129,.085) 0%,transparent 38%),radial-gradient(rgba(19,76,129,.068) 1.1px,transparent 1.1px);background-size:100% 100%,100% 100%,24px 24px;background-attachment:fixed;color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:500;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;margin:0}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;transition:all .15s ease}
button:active{transform:scale(.98)}
.bn,.tt,.hd2,.th1,.tot,.tots,.rc .nmz,.rc .sc{font-family:'Plus Jakarta Sans','Be Vietnam Pro',system-ui,sans-serif}

.wrap{max-width:1520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}

/* Tier 1: Floating Pill Top Header (Scots English Style + Wave Shapes) */
.bar{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 20px rgba(19,76,129,.06);flex-wrap:wrap}
.bar-deco{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.bar-deco::before{content:"";position:absolute;top:-38px;left:24%;width:320px;height:140px;background:linear-gradient(135deg,rgba(79,179,152,.11),rgba(223,241,246,.45));border-radius:45% 55% 65% 35%/50% 45% 55% 50%;transform:rotate(-6deg)}
.bar-deco::after{content:"";position:absolute;bottom:-48px;right:28%;width:170px;height:170px;border-radius:50%;border:18px solid rgba(19,76,129,.045);box-shadow:0 0 0 18px rgba(79,179,152,.045)}
.brand{position:relative;z-index:2;display:flex;align-items:center;gap:12px}
.bn{font-weight:800;font-size:17px;line-height:1.1;color:var(--navy);letter-spacing:.4px}
.bs{font-size:12px;color:var(--muted);font-weight:600}
.bar-r{position:relative;z-index:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sdot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;animation:scotsPulse 1.4s infinite ease-in-out}
@keyframes scotsPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.38;transform:scale(.82)}}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.k0{background:#EDF2F7;color:#4A5568;border-color:#E2E8F0}
.k1{background:#FEF9E7;color:#975A16;border-color:#F6E05E}
.k2{background:#E8F7F2;color:#1D6F58;border-color:#B7E4D6}
.k3{background:#FEECE9;color:#C5301C;border-color:#FBB6AB}

/* Inputs & Buttons */
.i{border:1.5px solid var(--line);border-radius:12px;padding:6px 11px;font:inherit;font-size:13.5px;font-weight:600;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.i:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(19,76,129,.1)}
.ipill{border-radius:999px;padding:6px 14px}

.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--navy);color:#fff;border-radius:999px;padding:7px 15px;font-weight:700;font-size:13px;border:1.5px solid var(--navy);white-space:nowrap}
.bt:hover{background:var(--navy-d);border-color:var(--navy-d)}
.bt.t{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.bt.t:hover{background:#2E806A;border-color:#2E806A}
.bt.o{background:var(--red);border-color:var(--red);color:#fff}
.bt.o:hover{background:#D93E23;border-color:#D93E23}
.bt.g{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.bt.g:hover{background:#F7FAFC;border-color:#B8C7D9}
.bt.sm{padding:5px 12px;font-size:12.5px}

/* Tier 2: AF Underline Navigation */
.afb{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1.5px solid var(--line);padding:0 4px}
.afs{flex:1;min-width:0;display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.afs::-webkit-scrollbar{display:none}
.afg{flex:0 0 auto;display:inline-flex;align-items:center;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;color:var(--muted);transition:all .15s}
.afg:hover{color:var(--navy)}
.afg.on{border-bottom-color:var(--navy);color:var(--navy)}
.afn{border:0;background:transparent;color:inherit;font-weight:700;font-size:14px;padding:9px 10px;display:inline-flex;align-items:center;gap:7px}
.afcnt{background:#E6EEF6;color:var(--navy);font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px}
.afg.on .afcnt{background:var(--navy);color:#fff}
.afi{border:0;background:transparent;color:var(--muted);border-radius:8px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center}
.afi:hover{background:#E6EEF6;color:var(--navy)}
.afi.del:hover{background:#FEECE9;color:var(--red)}

/* Tier 3: Class Pills & Action Bar */
.clsbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tb{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tab{border:1.5px solid var(--line);color:var(--ink);background:#fff;border-radius:999px;padding:6px 15px;font-weight:700;font-size:13.5px}
.tab:hover{border-color:#B8C7D9;background:#F8FAFC}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(19,76,129,.18)}

/* Cards & Forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 16px;box-shadow:0 2px 10px rgba(19,76,129,.04)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.sum-hd{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-weight:700;color:var(--navy);font-size:14px}
.sum-hd::-webkit-details-marker{display:none}
.mpill{display:inline-flex;align-items:center;gap:5px;background:#F1F6FB;color:var(--navy);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}

/* Session Schedule Chips */
.sch-box{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.sch-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dpill{display:inline-flex;align-items:center;gap:4px;background:#EDF6FA;color:var(--navy);border:1px solid #C6E2EE;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
.dpill.ext{background:#E8F7F2;color:#1D6F58;border-color:#B7E4D6}
.dpill button{border:0;background:transparent;color:inherit;opacity:.65;padding:0 2px;display:inline-flex;align-items:center}
.dpill button:hover{opacity:1;color:var(--red)}
.spill{display:inline-flex;align-items:center;gap:4px;background:#FFF5F5;color:#B91C1C;border:1px dashed #FEB2B2;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700}
.spill:hover{background:#FEE2E2}

/* Decorative EdTech Shapes for Info Strip & Top 3 Bento Showcase */
.info-card{position:relative;overflow:hidden;background-image:linear-gradient(116deg,#FFFFFF 0%,#FFFFFF 43%,rgba(223,241,246,.52) 43.2%,rgba(223,241,246,.52) 61%,rgba(232,247,242,.55) 61.2%,rgba(232,247,242,.55) 75%,#FFFFFF 75.2%)}
.info-card::after{content:"";position:absolute;right:115px;top:-26px;width:96px;height:96px;border-radius:50%;border:12px solid rgba(79,179,152,.08);pointer-events:none}
.info-card>*{position:relative;z-index:1}

.top{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:0 2px 12px rgba(19,76,129,.04)}
.top::before{content:"";position:absolute;top:-32px;left:37%;width:26%;height:115px;background:radial-gradient(ellipse at center,rgba(245,158,11,.14) 0%,transparent 72%);pointer-events:none;z-index:0}
.top::after{content:"";position:absolute;right:-26px;bottom:-30px;width:155px;height:155px;background:linear-gradient(135deg,rgba(79,179,152,.11),rgba(19,76,129,.07));border-radius:32px;transform:rotate(22deg);pointer-events:none;z-index:0}
.top-deco-left{position:absolute;left:-24px;bottom:-32px;width:130px;height:130px;border-radius:50%;border:16px solid rgba(223,241,246,.75);pointer-events:none;z-index:0}
.top-hd,.pod{position:relative;z-index:1}
.top-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tt{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:800;letter-spacing:.2px}
.top-sub{font-size:12px;color:var(--muted);font-weight:600}
.pod{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;align-items:stretch}
.rc{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;border:1.5px solid transparent}
.r1{background:#FFFDF5;border-color:#F6D365;box-shadow:0 4px 14px rgba(245,158,11,.1)}
.r2{background:var(--sky);border-color:#BCE2EC}
.r3{background:var(--sky-2);border-color:#D3E7F0}
.rk-badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.r1 .rk-badge{background:#FEF3C7;color:#B45309}
.r2 .rk-badge{background:var(--navy);color:#fff}
.r3 .rk-badge{background:var(--teal-d);color:#fff}
.rc .nmz{font-weight:800;font-size:15.5px;color:var(--navy);line-height:1.25;word-break:break-word}
.r1 .nmz{font-size:17px}
.rc .sc{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:20px;color:var(--navy);margin-top:4px}
.r1 .sc{font-size:24px;color:#B45309}
.rc .sub{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.rw{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;font-weight:700;font-size:11.5px;color:var(--navy)}
.rw input{width:56px;border:0;background:transparent;font:inherit;font-weight:800;text-align:center;color:var(--navy)}
.rw input:focus{outline:none}

/* Table */
.tw{background:#fff;border-radius:20px;border:1.5px solid var(--line);overflow:auto;max-height:70vh;max-height:70dvh;box-shadow:0 2px 12px rgba(19,76,129,.04)}
.tw table{border-collapse:separate;border-spacing:0;width:max-content}
.tw th,.tw td{border-right:1px solid #E6EDF5;border-bottom:1px solid #E6EDF5;padding:4px 6px;font-size:13px;text-align:center;white-space:nowrap}
.tw tbody tr{background:#fff}.tw tbody tr:nth-child(even){background:#F9FBFD}
.tw tbody tr:hover{background:#F1F6FB}
.th1{background:var(--navy);color:#fff;font-weight:700;font-size:13.5px;padding:7px 8px!important}
.th2{background:#E8F3F8;color:var(--navy);font-weight:700;font-size:12px;padding:5px 8px!important}
.th3{background:#0F3D68;color:#fff;font-weight:700;font-size:12.5px}
.bn-in{width:100%;min-width:136px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:4px 8px;margin-top:5px;color:#fff;font-size:11.5px;font-weight:500;text-align:center}
.bn-in::placeholder{color:rgba(255,255,255,.65)}
.bn-in:focus{outline:none;background:rgba(255,255,255,.2);border-color:#fff}
.fq{display:inline-flex;align-items:center;gap:3px;border:1px solid rgba(19,76,129,.22);border-radius:999px;background:#fff;color:var(--navy);font-size:11px;font-weight:700;padding:2px 8px}
.fq:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.tg{display:inline-flex;align-items:center;gap:3px;border:1px solid rgba(255,255,255,.4);color:rgba(255,255,255,.9);background:transparent;border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 8px;margin-top:3px}
.tg:hover{background:rgba(255,255,255,.15)}
.tg.on{background:var(--teal);border-color:var(--teal);color:#fff}
.cell{width:100%;height:36px;min-width:112px;background:transparent;border:0;display:flex;align-items:center;justify-content:center}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;line-height:1.3}
.sd{background:#DCFCE7;color:#15803D}.sp{background:#FEF3C7;color:#A16207}.sm{background:#FFEDD5;color:#C2410C}.sn{background:#FEE2E2;color:#B91C1C}.sz{background:#E2E8F0;color:#475569}.sa{background:#EDE9FE;color:#5B21B6}
.e{color:#CBD5E1;font-weight:700}
.dx{margin-left:8px;color:var(--muted);opacity:.25;border:0;background:transparent;font-weight:700;padding:2px 5px;border-radius:6px}
tr:hover .dx{opacity:.75}
.dx:hover{opacity:1!important;color:var(--red);background:#FEECE9}
.tot{font-weight:800;font-size:14px;color:var(--navy);background:#F8FAFC}
.tots{background:#ECFDF5!important;color:#047857;font-weight:800;font-size:15px}

/* Modals */
.ov{position:fixed;inset:0;background:rgba(15,42,67,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:50;height:100vh;height:100dvh}
.mo{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:480px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 20px 40px rgba(15,42,67,.22)}
.hd2{font-weight:800;font-size:17px;color:var(--navy);display:flex;align-items:center;gap:8px}
.x{border:0;background:#F1F5F9;color:var(--muted);border-radius:999px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center}
.x:hover{background:#E2E8F0;color:var(--ink)}
.fillb{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;display:flex;justify-content:center}
.fillb:hover{background:#F8FAFC;border-color:#B8C7D9}

/* Search Dropdown */
.sr{position:relative}
.sl{position:absolute;right:0;top:100%;margin-top:6px;min-width:280px;max-width:90vw;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px rgba(19,76,129,.16);z-index:40;overflow:hidden}
.si{display:block;width:100%;text-align:left;border:0;background:#fff;padding:10px 14px;border-bottom:1px solid #F1F5F9;font:inherit}
.si:hover,.si:active{background:#F1F6FB}
.wn{display:inline-flex;align-items:center;gap:3px;margin-left:6px;background:#FEE2E2;color:#B91C1C;border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 8px;white-space:nowrap;vertical-align:middle}

/* Mobile Responsive */
@media(max-width:640px){
  .cell{height:46px}.nm{min-width:120px!important}.bn{font-size:15.5px}.bt{padding:9px 14px}.chip{font-size:12px;padding:5px 10px}
}
@media(max-width:768px){
  .wrap{padding-left:10px;padding-right:10px;gap:10px}
  .bar{border-radius:20px;padding:10px 12px}
  .bar-r{width:100%;justify-content:space-between}
  .sl{left:0;right:auto}
  .pod{grid-template-columns:1fr;gap:8px}
  .rc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'rk nmz sc' 'rk sub rw';align-items:center;text-align:left;column-gap:10px;row-gap:2px;padding:10px 12px}
  .rk-badge{grid-area:rk;margin-bottom:0}
  .rc .nmz{grid-area:nmz;font-size:15px}
  .rc .sc,.r1 .sc{grid-area:sc;font-size:19px;margin-top:0;justify-self:end}
  .rc .sub{grid-area:sub;margin-top:0}
  .rc .rw{grid-area:rw;margin-top:4px;justify-self:end}
  .i,.rw input{font-size:16px}
  .bt{min-height:42px}
  .mo{padding:16px}
  .fillb{min-height:50px}
  .mview{display:flex;flex-direction:column;gap:8px}
  .mbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 16px rgba(19,76,129,.12);padding:8px;display:flex;flex-direction:column;gap:6px}
  .mnav{display:flex;gap:6px;align-items:center}
  .msel{flex:1;min-width:0;height:44px;font-weight:700;color:var(--navy)}
  .nv{flex:0 0 auto;min-height:44px;padding:0 11px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:3px}
  .nv:disabled{opacity:.35}
  .mbr{display:flex;gap:6px;align-items:center}
  .mtg,.mtg2{min-height:42px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px}
  .mtg.on,.mtg2.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
  .mfq{flex:1;min-height:42px;border-radius:999px;border:0;background:var(--navy);color:#fff;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .mrow{display:grid;grid-template-columns:38% repeat(var(--n),minmax(0,1fr));gap:6px;padding:7px;align-items:stretch;border-bottom:1px solid #E6EDF5;background:#fff}
  .ml{background:#fff;border-radius:18px;border:1.5px solid var(--line);overflow:hidden}
  .ml .mrow:nth-child(even){background:#F9FBFD}
  .mhd{background:var(--navy);color:#fff;border-radius:12px;border-bottom:0;font-weight:700;font-size:12.5px;text-align:center;align-items:center;padding:8px 6px}
  .mnm{display:flex;flex-direction:column;justify-content:center;min-width:0}
